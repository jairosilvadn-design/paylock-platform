<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PayLock — Painel</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>PayLock</h1>
    <div>
      <span id="user-email"></span>
      <button id="logout-btn" class="link-btn">Sair</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Cadastrar cliente / aparelho</h2>
      <form id="cliente-form">
        <div class="grid">
          <div>
            <label for="nome">Nome do cliente</label>
            <input id="nome" required />
          </div>
          <div>
            <label for="cpf">CPF</label>
            <input id="cpf" required />
          </div>
          <div>
            <label for="imei">IMEI do aparelho</label>
            <input id="imei" required pattern="[0-9]{15}" title="15 dígitos" />
          </div>
          <div>
            <label for="modelo">Modelo do aparelho</label>
            <input id="modelo" />
          </div>
          <div>
            <label for="valor">Valor da parcela (R$)</label>
            <input id="valor" type="number" step="0.01" required />
          </div>
          <div>
            <label for="vencimento">Dia de vencimento (próxima parcela)</label>
            <input id="vencimento" type="date" required />
          </div>
          <div>
            <label for="pix">Chave PIX (recebimento)</label>
            <input id="pix" required />
          </div>
          <div>
            <label><input id="termoAceito" type="checkbox" required /> Cliente assinou o
              <a href="../docs/TERMO_ADESAO.md" target="_blank">Termo de Adesão</a></label>
          </div>
        </div>
        <button type="submit">Salvar cliente</button>
      </form>
    </section>

    <section class="card">
      <h2>Clientes / aparelhos</h2>
      <table id="clientes-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>IMEI</th>
            <th>Parcela</th>
            <th>Vencimento</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="clientes-tbody">
          <!-- preenchido via JS -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="assets/firebase-config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
