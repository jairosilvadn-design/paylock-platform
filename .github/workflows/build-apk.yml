name: Build & Release Android APK

# Compila, assina e publica o APK do Agente PayLock automaticamente.
# Você nunca precisa abrir o Android Studio: dispare este workflow (manual ou
# a cada push que mexer em android/) e baixe o APK pronto na aba "Releases"
# deste repositório, junto com o checksum necessário para o QR Code de
# provisioning (ver docs/QR_PROVISIONING.md).

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar google-services.json a partir do segredo
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Configure o segredo GOOGLE_SERVICES_JSON_BASE64 (Settings > Secrets and variables > Actions)."
            echo "::error::Veja docs/DEPLOY.md, seção 'Build automático do APK'."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Preparar keystore de assinatura
        id: keystore
        env:
          EXISTING_KEYSTORE_BASE64: ${{ secrets.PAYLOCK_KEYSTORE_BASE64 }}
          EXISTING_KEYSTORE_PASSWORD: ${{ secrets.PAYLOCK_KEYSTORE_PASSWORD }}
          EXISTING_KEY_ALIAS: ${{ secrets.PAYLOCK_KEY_ALIAS }}
          EXISTING_KEY_PASSWORD: ${{ secrets.PAYLOCK_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$EXISTING_KEYSTORE_BASE64" ]; then
            echo "Usando o keystore já configurado (segredo PAYLOCK_KEYSTORE_BASE64)."
            echo "$EXISTING_KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            {
              echo "store_password=$EXISTING_KEYSTORE_PASSWORD"
              echo "key_alias=$EXISTING_KEY_ALIAS"
              echo "key_password=$EXISTING_KEY_PASSWORD"
              echo "generated=false"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Nenhum keystore configurado ainda — gerando um NOVO automaticamente neste run."
            echo "::warning::IMPORTANTE: salve o keystore anexado ao Release como segredo PAYLOCK_KEYSTORE_BASE64 (e as senhas), senão a PRÓXIMA build vai gerar um keystore diferente e você não conseguirá atualizar os apps já instalados nos aparelhos dos clientes."
            GEN_PASSWORD=$(openssl rand -hex 16)
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -alias paylock \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$GEN_PASSWORD" -keypass "$GEN_PASSWORD" \
              -dname "CN=PayLock, OU=PayLock, O=PayLock, L=Sao Paulo, ST=SP, C=BR"
            base64 -w0 keystore/release.jks > keystore/release.jks.b64
            {
              echo "store_password=$GEN_PASSWORD"
              echo "key_alias=paylock"
              echo "key_password=$GEN_PASSWORD"
              echo "generated=true"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## ⚠️ Keystore gerado automaticamente neste run"
              echo ""
              echo "Salve AGORA estes valores como Secrets do repositório"
              echo "(Settings → Secrets and variables → Actions → New repository secret),"
              echo "senão a próxima build vai gerar um keystore diferente:"
              echo ""
              echo "- \`PAYLOCK_KEYSTORE_BASE64\`: conteúdo do arquivo \`keystore-gerado.jks.b64\` anexado neste Release"
              echo "- \`PAYLOCK_KEYSTORE_PASSWORD\`: \`$GEN_PASSWORD\`"
              echo "- \`PAYLOCK_KEY_ALIAS\`: \`paylock\`"
              echo "- \`PAYLOCK_KEY_PASSWORD\`: \`$GEN_PASSWORD\`"
            } > keystore/AVISO_KEYSTORE.md
          fi

      - name: Build do APK assinado (release)
        env:
          PAYLOCK_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/release.jks
          PAYLOCK_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          PAYLOCK_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          PAYLOCK_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
          PAYLOCK_VERSION_CODE: ${{ github.run_number }}
          PAYLOCK_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: gradle assembleRelease --no-daemon

      - name: Calcular checksum (para o QR Code de provisioning)
        id: checksum
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          CHECKSUM=$(sha256sum "$APK_PATH" | cut -d' ' -f1 | xxd -r -p | base64 | tr '/+' '_-' | tr -d '=')
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Checksum (PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM): $CHECKSUM"

      - name: Montar nota do Release
        id: notes
        run: |
          {
            echo "APK compilado e assinado automaticamente pelo GitHub Actions."
            echo ""
            echo "- Checksum para o QR Code de provisioning (\`PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM\`):"
            echo "  \`${{ steps.checksum.outputs.checksum }}\`"
            echo "- URL de download deste APK (\`PROVISIONING_DEVICE_ADMIN_PACKAGE_DOWNLOAD_LOCATION\`):"
            echo "  será o link do arquivo .apk anexado a este Release."
            echo ""
            echo "Veja docs/QR_PROVISIONING.md para montar o QR Code com esses dois valores."
            if [ -f keystore/AVISO_KEYSTORE.md ]; then
              echo ""
              cat keystore/AVISO_KEYSTORE.md
            fi
          } > release-notes.md

      - name: Publicar Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Agente PayLock — build ${{ github.run_number }}
          body_path: android/release-notes.md
          files: |
            android/${{ steps.checksum.outputs.apk_path }}
            android/keystore/*.jks.b64
