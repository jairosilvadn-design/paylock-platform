[build]
  publish = "web"
  functions = "netlify/functions"
  command = "npm install"

[build.environment]
  # A chave do Firebase Web (AIza...) em web/assets/firebase-config.js é
  # PÚBLICA por design (client SDK) — a segurança real está nas Firestore
  # Rules, não no sigilo dela. Sem isso, o scanner de segredos da Netlify
  # falha o build achando que é uma credencial vazada.
  SECRETS_SCAN_OMIT_PATHS = "web/assets/firebase-config.js"

[functions]
  node_bundler = "esbuild"

# Rotina automática de verificação de vencidos — roda a cada hora.
# (Scheduled Functions é um recurso do plano pago da Netlify; em plano
# gratuito, substitua por um "cron externo" chamando esta mesma URL via
# GitHub Actions / cron-job.org — ver docs/DEPLOY.md.)
[functions."check-overdue"]
  schedule = "@hourly"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
